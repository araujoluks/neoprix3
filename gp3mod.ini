; gp3mod.ini - settings for gp3mod (installed as dinput.dll next to gp3_nocd.exe)

[framerate]
; Frames per second for the race. The game runs one physics step per frame, so
; this is also the physics rate. The game's menu allows 8..25.6; 0 = use the menu.
; Effective values are 256/n: 51 -> 51.2, 64 -> 64, 85 -> 85.3, 128 -> 128.
; Keep it at or below your monitor's refresh rate when vsync is on.
fps=51

[fixes]
; 1 = after Alt+Tab in a race, wait for the window to come back and restore the
; lost surfaces instead of letting the game rebuild the 3D device (which crashes
; under wrappers); minimize/restore during a race keep the display mode.
restore_surfaces=1
; 1 = pause the race while the game window is inactive (Alt+Tab), like the
; game already does in menus; otherwise it keeps drawing into dead surfaces.
pause_when_inactive=1
; 1 = Alt+Tab in a race leaves the window as it is (like a borderless game):
; the wrapper and the game are not told that focus left, so nothing is
; minimized or lost; the race pauses until the window is in front again.
seamless_alt_tab=1
; 1 = drop the software sprite writer's out-of-bounds writes instead of crashing
; (original game bug: sprites near the screen edge write past the surface), and
; drop the writes of the frame in flight when Alt+Tab takes its surface away.
span_guard=1
; 1 = the race frame limiter and the pause screen sleep instead of spinning
; (the original burns a whole CPU core waiting for the next frame).
sleep_in_limiter=1

[display]
; Replaces the game's 1280x1024 modes with this resolution (0 = keep).
width=1920
height=1080
; 1 = widescreen keeps the vertical field of view and shows more at the sides
; (Hor+); 0 = the game's own behaviour (4:3 view stretched to the screen).
hor_plus=1
; 1 = size the game window to its monitor at start (under dgVoodoo it opens
; at 800x600 until an Alt+Tab); 0 = leave it.
fit_window=1
; Field of view in % of the game's (100 = as the game; more = wider).
fov=100
; 1 = wait for the monitor's refresh on every flip (the game's behaviour). With
; a frame rate that does not divide the refresh rate this swings between e.g.
; 60 and 30 fps; 0 = no wait, a steady rate from the limiter, may tear.
vsync=0
; Virtual mirror at the top of the screen (hardware mode), size in % of the
; game's rear view (100 = native); 0 = off, only the cockpit mirrors.
virtual_mirror=100
; Its top edge, in % of the screen height from the top (0..80).
virtual_mirror_y=1

[menu]
; In a race, this key opens the gp3mod settings panel (arrows change, Esc
; closes; works while paused too). Virtual-key code, 122 = F11; 0 = no menu.
key=122

[debug]
; 1 = log every call to the routines that release the 3D device or surfaces
; (who called, which thread). For chasing Alt+Tab problems.
trace_device=0
